services:
  db:
    image: mariadb:10.11
    container_name: bibliotech-db
    environment:
      MARIADB_DATABASE: bibliotech_db
      MARIADB_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
    container_name: bibliotech-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mariadb://db:3306/bibliotech_db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      JWT_KEY: ${JWT_KEY}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  mariadb_data:
